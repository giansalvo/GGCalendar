name: CI

# Build and run the unit tests on every push and pull request.
on:
  push:
  pull_request:

jobs:
  build-test:
    # The app targets net10.0-windows, so it needs a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build GGCalendar.sln -c Release

      - name: Test
        run: dotnet test GGCalendar.sln -c Release --no-build
