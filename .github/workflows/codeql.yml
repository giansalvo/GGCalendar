name: CodeQL

# Static security analysis of the C# code (results in the Security tab of the repository).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so that new queries also scan code that has not changed.
    - cron: "17 4 * * 1"

jobs:
  analyze:
    # The app targets net10.0-windows, so it needs a Windows runner.
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: dotnet build GGCalendar.sln -c Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
